<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pronóstico del Tiempo</title>

    <style>
        body {
            
            background: "{{ body_bg }}";

        }

        main {
            background: "{{ main_bg }}";
        }

    </style>

    <link rel="stylesheet" href="{{ url_for('static', filename='styles/styles.css') }}">
</head>

<body>
    <div class="container">

        <div class="sidebar">

            <input type="date" id="date" name="date"></input>
            <input type="number" step="0.1" id="precipitation" name="precipitation" placeholder="Precipitación"></input>
            <input type="number" step="0.1" id="wind" name="wind" placeholder="Viento"></input>
            <input type="number" id="humidity" name="humidity" placeholder="Humedad"></input>

            <button type="submit" id="predict_button" name="predict_button">
                Predecir
            </button>

        </div>

        <div class="main">

            <div class="date" id="date" name="date">{{ date }}</div>
                
            <img id="icon" name="icon" src="{{ weather_icon }}" alt="">

            <div class="msg" id="msg" name="msg">{{ msg }}</div>

        </div>
    </div>
</body>

</html>
